datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.default.svc.cluster.local:3100
        isDefault: false
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-operated.default.svc.cluster.local:9090
        isDefault: true